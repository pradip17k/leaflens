name: Test and publish LeafLens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check application syntax
        run: |
          node --check dist/app.mjs
          node --check dist/core.mjs
          node --check dist/data.mjs
          node --check dist/inference.mjs
          node --check dist/crops.mjs
          node --check dist/reliability.mjs
          node --check dist/triage.mjs
          node --check dist/research-dashboard.mjs
      - name: Verify metrics and validation
        run: node --test tests/reliability.test.mjs tests/core.test.mjs tests/inference.test.mjs tests/model-assets.test.mjs tests/ui.test.mjs procurement-prototype/tests/domain.test.mjs procurement-prototype/tests/storage.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify field-photo audit
        run: |
          python -m pip install Pillow==12.3.0
          python tests/test_field_audit.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
